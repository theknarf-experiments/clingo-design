#
# Compiles clingo (https://potassco.org/clingo/) to WebAssembly via Emscripten.
#
# Upstream ships an official `web` CMake target (app/web/main.cc) exporting a
# single C function:
#
#     int run(char const *program, char const *options)
#
# It feeds `program` to clingo over a redirected stdin and splits `options` on
# whitespace into argv. Everything clingo prints goes to stdout, which the
# Emscripten runtime routes to the Module.print/printErr callbacks.
#
# The toolchain (emsdk, cmake, ninja) is declared in the repo-root mise.toml;
# mise merges that config with this one.
#

[env]
CLINGO_VERSION = "v5.8.2"
# clingo-lpx adds linear arithmetic over rationals as a theory propagator.
CLINGO_LPX_VERSION = "v1.3.0"

[tasks."wasm:fetch"]
description = "Clone the pinned clingo source into vendor/"
dir = "{{config_root}}"
sources = ["mise.toml"]
outputs = ["vendor/clingo/CMakeLists.txt"]
run = """
set -euo pipefail
if [ -e vendor/clingo/CMakeLists.txt ]; then
	echo "==> Using existing clingo checkout at vendor/clingo"
	exit 0
fi
echo "==> Fetching clingo $CLINGO_VERSION"
rm -rf vendor/clingo
mkdir -p vendor
git clone --recursive --depth 1 --branch "$CLINGO_VERSION" \
	https://github.com/potassco/clingo.git vendor/clingo
"""

[tasks."wasm:fetch-lpx"]
description = "Clone the pinned clingo-lpx source into vendor/"
dir = "{{config_root}}"
sources = ["mise.toml"]
outputs = ["vendor/clingo-lpx/libclingo-lpx/clingo-lpx.h"]
run = """
set -euo pipefail
if [ -e vendor/clingo-lpx/libclingo-lpx/clingo-lpx.h ]; then
	echo "==> Using existing clingo-lpx checkout at vendor/clingo-lpx"
	exit 0
fi
echo "==> Fetching clingo-lpx $CLINGO_LPX_VERSION"
rm -rf vendor/clingo-lpx
mkdir -p vendor
git clone --depth 1 --branch "$CLINGO_LPX_VERSION" \
	https://github.com/potassco/clingo-lpx.git vendor/clingo-lpx
# Only imath: the other submodule is Catch2, which we never build.
git -C vendor/clingo-lpx submodule update --init --depth 1 third_party/imath
"""

[tasks."wasm:build"]
description = "Compile clingo to wasm/clingo.mjs + wasm/clingo.wasm"
depends = ["wasm:fetch", "wasm:fetch-lpx"]
dir = "{{config_root}}"
sources = [
	"mise.toml",
	"types/clingo.d.mts",
	"native/*",
	"vendor/clingo/CMakeLists.txt",
	"vendor/clingo-lpx/libclingo-lpx/clingo-lpx.h",
]
outputs = ["wasm/clingo.mjs", "wasm/clingo.wasm", "wasm/clingo.d.mts"]
run = """
set -euo pipefail

# Python, Lua and threads are all off: none of them work in this target.
echo "==> Configuring"
emcmake cmake -S native -B .build -G Ninja \
	-DCLINGO_VENDOR_DIR="$PWD/vendor/clingo" \
	-DCLINGO_LPX_VENDOR_DIR="$PWD/vendor/clingo-lpx" \
	-DCLINGO_BUILD_WEB=Off \
	-DCLINGO_BUILD_WITH_PYTHON=Off \
	-DCLINGO_BUILD_WITH_LUA=Off \
	-DCLINGO_BUILD_SHARED=Off \
	-DCLINGO_BUILD_APPS=Off \
	-DCLINGO_BUILD_TESTS=Off \
	-DCLASP_BUILD_WITH_THREADS=Off \
	-DCMAKE_BUILD_TYPE=Release \
	-DCMAKE_CXX_FLAGS="-fexceptions" \
	-DCMAKE_CXX_FLAGS_RELEASE="-Os -DNDEBUG" \
	-DCMAKE_EXE_LINKER_FLAGS="-fexceptions -sMODULARIZE=1 -sEXPORT_ES6=1 -sEXPORT_NAME=createClingo -sALLOW_MEMORY_GROWTH=1 -sENVIRONMENT=web,worker,node -sINVOKE_RUN=0 -sEXIT_RUNTIME=0 -sSTACK_SIZE=16MB --no-entry"

echo "==> Building"
cmake --build .build --target clingo_design

# Emscripten names the wasm after the JS basename, so the .js -> .mjs rename
# keeps the internal "clingo.wasm" reference valid.
echo "==> Copying artifacts to wasm/"
mkdir -p wasm
cp .build/bin/clingo.js wasm/clingo.mjs
cp .build/bin/clingo.wasm wasm/clingo.wasm

# Sibling declaration so TypeScript can resolve the generated glue module.
cp types/clingo.d.mts wasm/clingo.d.mts

ls -lh wasm
"""

[tasks."wasm:clean"]
description = "Remove the CMake build tree and emitted wasm artifacts"
dir = "{{config_root}}"
run = "rm -rf .build wasm"

[tasks."wasm:distclean"]
description = "Also remove the vendored clingo checkout"
depends = ["wasm:clean"]
dir = "{{config_root}}"
run = "rm -rf vendor"
